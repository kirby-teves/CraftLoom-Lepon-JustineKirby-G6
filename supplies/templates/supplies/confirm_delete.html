{% extends "base.html" %}
{% block title %}Delete material{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Delete material?</h1>
  <p>This will permanently delete <strong>{{ material.name }}</strong>.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn secondary" href="{% url 'supplies:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
