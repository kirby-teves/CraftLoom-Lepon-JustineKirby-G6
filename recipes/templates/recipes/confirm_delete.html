{% extends "base.html" %}
{% block title %}Delete product{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Delete product?</h1>
  <p>This will permanently delete <strong>{{ product.name }}</strong> and its recipe. Your supplies are not affected.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn secondary" href="{% url 'recipes:detail' product.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
