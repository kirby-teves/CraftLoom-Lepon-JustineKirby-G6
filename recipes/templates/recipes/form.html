{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url 'recipes:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
